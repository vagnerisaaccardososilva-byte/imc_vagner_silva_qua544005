<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IMC| Índice de Massa Corporal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  </head>
  <body>
    <div class="container">
        <main class="d-flex justify-content-center align-items-center vh-100">
            <div class="row">
                <div class="col-12 d-flex justify-content-center">
                    <h1>IMC</h1>
                </div>
                <hr>
                <div class="col-12 d-flex justify-content-center">
                    <h2>Índice de Massa Corporal</h2>
                </div>
                <form action="" method="POST">
                    <div class="col-12 mt-5">
                        <label for="massa" class="form-label">Massa em kg:</label>
                        <input type="number" name="massa" class="form-control" step="0.01" min="0" required>
                    </div>
                    <div class="col-12 mt-3">
                        <label for="altura" class="form-label">altura em metros:</label>
                        <input type="number" name="altura" class="form-control" step="0.01" min="0" required>
                    </div>
                    <div class="d-flex  justify-content-center mt-5">
                        <button type="submit" class="btn btn-success">Calcular IMC</button>
                    </div>
                </form>
                <div class="d-flex justify-content-center mt-5">
                    {% if result %}
                        <hr>
                        <h3>{{ result }}</h3>
                    {% else %}
                        <span></span>
                    {% endif %}
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
  </body>
</html>
